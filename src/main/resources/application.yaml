server:
  port: 8080
spring:
  application:
    name: "NotesApi"
  config:
    import: optional:file:.env[.properties] # Магия: Spring сам пойдет и прочитает твой .env
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
