server:
  port: 8080
spring:
  application:
    name: "NotesApi"
  config:
    import: optional:file:.env[.properties] # Магия: Spring сам пойдет и прочитает твой .env
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

springdoc:
  swagger-ui:
    path: /docs
