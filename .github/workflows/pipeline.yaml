name: CI/CD Pipeline
run-name: Build and Deploy service to VPS by ${{ github.actor }}🚀
on:
  push:
    branches:
      - 'release'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: x64
          cache: gradle
      - name: Check formatting
        run: ./gradlew ktlintCheck
      - name: Run analyze(detekt)
        run: ./gradlew detekt
      - name: Run test
        run: ./gradlew test




